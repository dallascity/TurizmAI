services:
  app:
    build: .
    container_name: turizmai-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      APP_LOCALE: tr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: turizmai
      DB_USERNAME: turizmai
      DB_PASSWORD: secret
      LOG_CHANNEL: stderr
      # Google Gemini: anahtar proje kökündeki .env dosyasından okunur
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-flash-lite-latest,gemini-flash-latest}
    volumes:
      - storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: turizmai-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: turizmai-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: turizmai
      MYSQL_USER: turizmai
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  storage:
  dbdata:
